services:
  postgres:
    image: postgres:16-alpine
    container_name: bytearena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bytearena
      POSTGRES_PASSWORD: bytearena_dev
      POSTGRES_DB: bytearena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytearena -d bytearena"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bytearena-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bytearena:bytearena_dev@postgres:5432/bytearena
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    env_file:
      - path: .env.local
        required: false
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Anonymous volumes keep container-built artifacts from being shadowed by
      # the host bind mount above. node_modules in particular must stay Linux-native.
      - /app/node_modules
      - /app/.next
      # Lets the app shell out to the host Docker daemon to run Sprite containers
      # when EXECUTION_MODE=local.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
