name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sh scripts/check-repository-hygiene.sh

  schema-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roughstack
          POSTGRES_PASSWORD: migration_test_only
          POSTGRES_DB: roughstack_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roughstack -d roughstack_migration_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://roughstack:migration_test_only@127.0.0.1:5432/roughstack_migration_test
      SHADOW_DATABASE_URL: postgresql://roughstack:migration_test_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Route modules construct the Prisma adapter during Next.js page-data
          # collection, but the build does not connect to this placeholder URL.
          DATABASE_URL: postgresql://roughstack:roughstack_dev@127.0.0.1:5432/roughstack

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sprite/go.mod
          cache-dependency-path: sprite/go.mod
      - working-directory: sprite
        run: gofmt -l . | tee /tmp/gofmt-files && test ! -s /tmp/gofmt-files
      - working-directory: sprite
        run: go vet ./...
      - working-directory: sprite
        run: go test ./...
      - working-directory: sprite
        run: go test -race ./...
