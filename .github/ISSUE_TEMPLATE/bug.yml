name: Bug report
description: Report a reproducible defect in the public platform.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private submissions, or vulnerability details. Use private security reporting for security issues.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release version where the problem occurs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal deterministic steps, including commands and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker, Node, Go, browser, and execution mode as relevant.
    validations:
      required: true
